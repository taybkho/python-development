[project]
name = "python-development"
version = "0.1.0"
description = "Python Development – End-to-End Data Pipeline"
readme = "README.md"
authors = [
    { name = "taybkho", email = "taybkho@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
python-development = "python_development:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
